name: Build QuickCircle Release APK

on:
  push:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare Release Signing Keystore
        env:
          SECRET_KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SECRET_KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KS_PATH="${{ runner.temp }}/release-upload.jks"
          if [ -n "$SECRET_KS" ]; then
            echo "$SECRET_KS" | base64 -d > "$KS_PATH"
            echo "STORE_PASSWORD=$SECRET_STORE_PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PW" >> "$GITHUB_ENV"
          elif [ -f debug.keystore.base64 ]; then
            # Reuse the repo's deterministic OSS signing key so every CI build updates cleanly in-place
            OSS_SRC="${{ runner.temp }}/oss-src.keystore"
            base64 -d debug.keystore.base64 > "$OSS_SRC"
            keytool -importkeystore -noprompt \
              -srckeystore "$OSS_SRC" -srcstorepass android -srcalias androiddebugkey -srckeypass android \
              -destkeystore "$KS_PATH" -deststoretype PKCS12 -deststorepass quickcircle-oss -destalias upload -destkeypass quickcircle-oss
            rm -f "$OSS_SRC"
            echo "STORE_PASSWORD=quickcircle-oss" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=quickcircle-oss" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt \
              -keystore "$KS_PATH" \
              -storetype PKCS12 \
              -alias upload \
              -storepass quickcircle-oss \
              -keypass quickcircle-oss \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=QuickCircle OSS,O=QuickCircle,C=US"
            echo "STORE_PASSWORD=quickcircle-oss" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=quickcircle-oss" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        run: gradle :app:assembleRelease

      - name: Upload QuickCircle Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickCircle-release-apk
          path: app/build/outputs/apk/release/app-release.apk
