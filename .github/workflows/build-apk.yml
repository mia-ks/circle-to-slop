name: Build QuickCircle Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Compute Monotonic Version Code
        run: |
          CI_VERSION_CODE=$(( ($(date -u +%s) - 1767225600) + 100000 ))
          echo "CI_VERSION_CODE=$CI_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Computed monotonic versionCode: $CI_VERSION_CODE"

      - name: Prepare Release Signing Keystore
        env:
          SECRET_KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SECRET_KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KS_PATH="${{ runner.temp }}/release-upload.jks"
          if [ -n "$SECRET_KS" ]; then
            echo "$SECRET_KS" | base64 -d > "$KS_PATH"
            echo "STORE_PASSWORD=$SECRET_STORE_PW" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PW" >> "$GITHUB_ENV"
          elif [ -f debug.keystore.base64 ]; then
            # Reuse the repo's deterministic OSS signing key so every CI build updates cleanly in-place
            OSS_SRC="${{ runner.temp }}/oss-src.keystore"
            base64 -d debug.keystore.base64 > "$OSS_SRC"
            keytool -importkeystore -noprompt \
              -srckeystore "$OSS_SRC" -srcstorepass android -srcalias androiddebugkey -srckeypass android \
              -destkeystore "$KS_PATH" -deststoretype PKCS12 -deststorepass quickcircle-oss -destalias upload -destkeypass quickcircle-oss
            rm -f "$OSS_SRC"
            echo "STORE_PASSWORD=quickcircle-oss" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=quickcircle-oss" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt \
              -keystore "$KS_PATH" \
              -storetype PKCS12 \
              -alias upload \
              -storepass quickcircle-oss \
              -keypass quickcircle-oss \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=QuickCircle OSS,O=QuickCircle,C=US"
            echo "STORE_PASSWORD=quickcircle-oss" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=quickcircle-oss" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        run: gradle :app:assembleRelease --no-configuration-cache

      - name: Verify Signed Release APK
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs -v "$APK_PATH"
          "$BUILD_TOOLS_DIR/aapt2" dump badging "$APK_PATH" | grep -E "package:|sdkVersion:|targetSdkVersion:"

      - name: Publish Pure APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: latest
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          VERSIONED_APK="QuickCircle-v1.1.${{ github.run_number }}.apk"
          mkdir -p dist
          cp "$APK_PATH" "dist/QuickCircle.apk"
          cp "$APK_PATH" "dist/$VERSIONED_APK"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            OLD_VERSIONED=$(gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | grep -E '^QuickCircle-v.*\.apk$' || true)
            for OLD_ASSET in $OLD_VERSIONED; do
              if [ "$OLD_ASSET" != "$VERSIONED_APK" ]; then
                gh release delete-asset "$TAG_NAME" "$OLD_ASSET" --yes || true
              fi
            done
            gh release upload "$TAG_NAME" "dist/QuickCircle.apk" "dist/$VERSIONED_APK" --clobber
            gh release edit "$TAG_NAME" \
              --title "QuickCircle v1.1.${{ github.run_number }}" \
              --notes "Latest signed release APK (versionCode ${CI_VERSION_CODE}, signed consistently for in-place updates). Download QuickCircle.apk directly — no zip extraction needed." \
              --latest
          else
            gh release create "$TAG_NAME" "dist/QuickCircle.apk" "dist/$VERSIONED_APK" \
              --title "QuickCircle v1.1.${{ github.run_number }}" \
              --notes "Latest signed release APK (versionCode ${CI_VERSION_CODE}, signed consistently for in-place updates). Download QuickCircle.apk directly — no zip extraction needed." \
              --target "${{ github.sha }}" \
              --latest
          fi

          {
            echo "## QuickCircle v1.1.${{ github.run_number }} (versionCode ${CI_VERSION_CODE})"
            echo "- Direct pure APK download: https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/QuickCircle.apk"
            echo "- Versioned APK: https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${VERSIONED_APK}"
          } >> "$GITHUB_STEP_SUMMARY"
